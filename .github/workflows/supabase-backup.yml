name: Supabase Database Backup

on:
  schedule:
    # Hourly backup: every hour, keeps last 48h via artifact retention
    - cron: "0 * * * *"
    # Daily full backup at 2:00 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual backup"
        required: false
        default: "Manual request"
        type: string

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          brew install supabase/tap/supabase
          supabase --version

      - name: Prepare direct DATABASE_URL (strip pgbouncer)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # pg_dump needs direct connection, not via PgBouncer
          DIRECT_URL=$(echo "$DATABASE_URL" | sed 's/?pgbouncer=true//' | sed 's/:6543\//:5432\//')
          echo "DIRECT_DATABASE_URL=$DIRECT_URL" >> $GITHUB_ENV
          echo "Connection target: $(echo "$DIRECT_URL" | sed 's/:[^:@]*@/:***@/')"

      - name: Create backup directory
        run: mkdir -p backups

      - name: Dump roles and permissions
        run: |
          supabase db dump --db-url "$DIRECT_DATABASE_URL" -f backups/roles.sql --role-only
          echo "Roles dump: $(wc -l < backups/roles.sql) lines"

      - name: Dump schema (tables, functions, triggers, RLS)
        run: |
          supabase db dump --db-url "$DIRECT_DATABASE_URL" -f backups/schema.sql
          echo "Schema dump: $(wc -l < backups/schema.sql) lines"

      - name: Dump data
        run: |
          supabase db dump --db-url "$DIRECT_DATABASE_URL" \
            -f backups/data.sql \
            --use-copy \
            --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"
          echo "Data dump: $(wc -l < backups/data.sql) lines"

      - name: Verify dumps are non-empty
        run: |
          for f in roles.sql schema.sql data.sql; do
            SIZE=$(stat -c%s "backups/$f" 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 100 ]; then
              echo "::error::Backup file $f is too small (${SIZE} bytes) — dump likely failed"
              exit 1
            fi
            echo "✓ $f: ${SIZE} bytes"
          done

      - name: Generate SHA-256 checksums
        run: |
          cd backups
          sha256sum *.sql > checksums.sha256
          cat checksums.sha256

      - name: Compress backup
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d-%H%M')
          tar -czf "backups/supabase-${TIMESTAMP}.tar.gz" \
            -C backups roles.sql schema.sql data.sql checksums.sha256
          echo "BACKUP_FILE=supabase-${TIMESTAMP}.tar.gz" >> $GITHUB_ENV
          ls -lh backups/*.tar.gz

      - name: Count tables and key rows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "## Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          for f in roles.sql schema.sql data.sql; do
            SIZE=$(ls -lh "backups/$f" | awk '{print $5}')
            echo "| $f | $SIZE |" >> $GITHUB_STEP_SUMMARY
          done
          echo "| ${{ env.BACKUP_FILE }} | $(ls -lh backups/*.tar.gz | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY

      - name: Set backup type and retention
        run: |
          # Daily backup at 2 AM UTC gets 30 day retention; hourly gets 2 days
          HOUR=$(date -u '+%H')
          if [ "$HOUR" = "02" ]; then
            echo "BACKUP_TYPE=daily"
            echo "RETENTION_DAYS=30" >> $GITHUB_ENV
          else
            echo "BACKUP_TYPE=hourly"
            echo "RETENTION_DAYS=2" >> $GITHUB_ENV
          fi
          echo "Backup type: $(cat $GITHUB_ENV | grep BACKUP_TYPE || echo 'hourly')"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-${{ env.BACKUP_TYPE || 'manual' }}-${{ github.run_number }}
          path: |
            backups/roles.sql
            backups/schema.sql
            backups/data.sql
            backups/checksums.sha256
            backups/*.tar.gz
          retention-days: ${{ env.RETENTION_DAYS || 30 }}

      - name: Commit and push backup
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Only commit the compressed archive — keep repo small
          git add backups/*.tar.gz backups/checksums.sha256
          git commit -m "chore(backup): Supabase dump $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push || echo "Push failed — backup still available as artifact"

      - name: Cleanup old backups (keep last 30 days)
        run: |
          find backups/ -name "supabase-*.tar.gz" -mtime +30 -delete 2>/dev/null || true
          echo "Old backups cleaned up"
